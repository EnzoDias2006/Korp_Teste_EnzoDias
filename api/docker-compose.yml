services:
  postgres:
    image: postgres:16-alpine
    container_name: korp-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      STOCK_DB_PASSWORD: ${STOCK_DB_PASSWORD:-stock_pass}
      BILLING_DB_PASSWORD: ${BILLING_DB_PASSWORD:-billing_pass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d stock_db && pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d billing_db",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - korp-network

  stock:
    build:
      context: ./services/stock
      dockerfile: Dockerfile
    container_name: korp-stock
    environment:
      HTTP_ADDR: "${STOCK_HTTP_ADDR:-:8081}"
      DATABASE_URL: "postgres://stock_user:${STOCK_DB_PASSWORD:-stock_pass}@postgres:5432/stock_db?sslmode=disable"
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-http://localhost:4200}"
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8081/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    networks:
      - korp-network

  billing:
    build:
      context: ./services/billing
      dockerfile: Dockerfile
    container_name: korp-billing
    environment:
      HTTP_ADDR: "${BILLING_HTTP_ADDR:-:8082}"
      DATABASE_URL: "postgres://billing_user:${BILLING_DB_PASSWORD:-billing_pass}@postgres:5432/billing_db?sslmode=disable"
      STOCK_SERVICE_URL: "http://stock:8081"
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-http://localhost:4200}"
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
      stock:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8082/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    networks:
      - korp-network

volumes:
  postgres_data:

networks:
  korp-network:
    name: korp-network
    driver: bridge
